name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.0.0，无需 v 前缀）'
        required: true
        type: string
      notes:
        description: '发版说明（可选）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "版本号不合法：$VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "发布版本：$VERSION"

      - name: Create tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "标签 $TAG 已存在，跳过创建"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap android platform dir
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/bootstrap_android.sh

      - name: Install dependencies
        run: flutter pub get

      # 与 build-apk 走同一套脚本，避免两条流水线的构建参数漂移。
      - name: Build, sign and verify
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash scripts/build_release.sh "${{ steps.ver.outputs.version }}" "${{ github.run_number }}"
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 青阳水印相机 v${{ steps.ver.outputs.version }}
          body: |
            ## 青阳水印相机 v${{ steps.ver.outputs.version }}

            ${{ inputs.notes }}

            ### 该下哪个包

            | 文件 | 适用设备 | 体积 |
            | --- | --- | --- |
            | `qingyang-watermark-v${{ steps.ver.outputs.version }}-arm64-v8a.apk` | **绝大多数手机**（2016 年以后的机型，首选） | 约 21 MB |
            | `qingyang-watermark-v${{ steps.ver.outputs.version }}-armeabi-v7a.apk` | 32 位老设备 / 低端机（arm64 包装不上时再用） | 约 19 MB |

            拿不准就装 `arm64-v8a`：装错了系统会提示「应用未安装」或
            「解析包时出现问题」，换成另一个即可，不会损坏任何数据。

            ### 安装

            1. 下载与手机匹配的 `.apk`
            2. 允许浏览器 / 文件管理器「安装未知来源应用」
            3. 首次启动授予相机与精确定位权限

            ### 校验

            ```
            sha256sum -c SHA256SUMS.txt
            ```

            构建信息：Flutter stable · JDK 17 · build-number ${{ github.run_number }} ·
            签名 v1+v2+v3 · 16 KB 页对齐
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
