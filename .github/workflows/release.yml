name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.0.0，无需 v 前缀）'
        required: true
        type: string
      notes:
        description: '发版说明（可选）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "版本号不合法：$VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "发布版本：$VERSION"

      - name: Create tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "标签 $TAG 已存在，跳过创建"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap android platform dir
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/bootstrap_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name ${{ steps.ver.outputs.version }} \
            --build-number ${{ github.run_number }}

      - name: Zipalign and re-sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          bash scripts/sign_apk.sh \
            build/app/outputs/flutter-apk/app-release.apk \
            qingyang-watermark-v${{ steps.ver.outputs.version }}.apk

      - name: Checksums
        run: |
          if [ ! -f qingyang-watermark-v${{ steps.ver.outputs.version }}.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk \
               qingyang-watermark-v${{ steps.ver.outputs.version }}.apk
          fi
          sha256sum qingyang-watermark-v${{ steps.ver.outputs.version }}.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 青阳水印相机 v${{ steps.ver.outputs.version }}
          body: |
            ## 青阳水印相机 v${{ steps.ver.outputs.version }}

            ${{ inputs.notes }}

            ### 安装
            1. 下载 `qingyang-watermark-v${{ steps.ver.outputs.version }}.apk`
            2. 允许「安装未知来源应用」
            3. 首次启动授予相机与精确定位权限

            ### 校验
            ```
            sha256sum -c SHA256SUMS.txt
            ```

            构建信息：Flutter stable · JDK 17 · build-number ${{ github.run_number }}
          files: |
            qingyang-watermark-v${{ steps.ver.outputs.version }}.apk
            SHA256SUMS.txt
          fail_on_unmatched_files: true
