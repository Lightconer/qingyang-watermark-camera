name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap android platform dir
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/bootstrap_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name 1.0.0 \
            --build-number ${{ github.run_number }}

      - name: Zipalign and re-sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          bash scripts/sign_apk.sh \
            build/app/outputs/flutter-apk/app-release.apk \
            qingyang-watermark-1.0.0-${{ github.run_number }}.apk

      - name: Collect artifact
        run: |
          if [ ! -f qingyang-watermark-1.0.0-${{ github.run_number }}.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk \
               qingyang-watermark-1.0.0-${{ github.run_number }}.apk
          fi
          sha256sum qingyang-watermark-1.0.0-${{ github.run_number }}.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qingyang-watermark-apk
          path: |
            qingyang-watermark-1.0.0-${{ github.run_number }}.apk
            SHA256SUMS.txt
          retention-days: 14
